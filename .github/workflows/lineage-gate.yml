name: lineage-gate

on:
  pull_request:

jobs:
  lineage-gate:
    name: lineage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: dbt parse
        run: uv run dbt parse --project-dir warehouse --profiles-dir warehouse
      - name: Lineage gate
        run: uv run python controls/lineage_gate.py --skip-parse

  dbt-build:
    name: dbt-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: dbt build (integrity checks)
        run: uv run dbt build --project-dir warehouse --profiles-dir warehouse
